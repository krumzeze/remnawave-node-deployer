---
# Установка Docker и разворот контейнера remnanode.
# SECRET_KEY/NODE_PORT приходят из CreateNode (Remnawave API) через extra-vars.
- name: Deploy remnanode
  hosts: all
  become: true
  vars:
    remnanode_secret_key: ""   # передаётся из оркестратора
    remnanode_port: 0
    cert_dir_host: /opt/remnanode/certs
    # ansible_architecture → имя архитектуры в apt-репозитории Docker.
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
  tasks:
    # Docker ставим из официального apt-репозитория, а не через «curl | sh».
    # Convenience-скрипт при уже установленном Docker (часть облачных образов
    # идёт с предустановленным docker.io, плюс повторный прогон) просто выходит,
    # ничего не доставляя, поэтому docker-compose-plugin не появляется и
    # docker_compose_v2 падает на «Up remnanode» с «does not have the compose
    # plugin». apt-установка идемпотентна и доустанавливает плагин compose даже
    # на таких образах (ср. перевод acme.sh на git clone по той же причине).
    - name: Install Docker apt prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create apt keyrings dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # Кодовое имя релиза берём из фактов; bootstrap уже отбраковал не-Ubuntu и
    # не-KVM, так что это jammy/noble. Архитектуру мапим в имя репозитория.
    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch_map[ansible_architecture] | default(ansible_architecture) }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    # Convenience-скрипт стартовал и включал docker сам; apt-установка этого не
    # гарантирует — демон может остаться не поднятым, и docker_compose_v2 упадёт
    # на «Cannot connect to the Docker daemon». Запускаем и ставим в автозапуск,
    # чтобы нода пережила и перезагрузку сервера.
    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # Порт, на котором контейнер ноды слушает панель (APP_PORT). hardening
    # оставил default deny + только 22, поэтому без этого правила управляющее
    # соединение панель→нода упрётся в firewall и нода не выйдет online.
    - name: Allow node app port in UFW
      community.general.ufw:
        rule: allow
        port: "{{ remnanode_port | string }}"
        proto: tcp

    - name: Create remnanode dir
      ansible.builtin.file:
        path: /opt/remnanode
        state: directory
        mode: "0750"

    # Каталог монтируется в контейнер всегда (см. шаблон compose). Для TLS его
    # уже наполнил issue_cert; для domain-free он просто пуст — создаём, чтобы
    # docker не сделал на его месте root-only каталог и монтирование не упало.
    - name: Ensure certs dir exists (mounted into container)
      ansible.builtin.file:
        path: "{{ cert_dir_host }}"
        state: directory
        mode: "0750"

    - name: Render docker-compose for remnanode
      ansible.builtin.template:
        src: remnanode-compose.yml.j2
        dest: /opt/remnanode/docker-compose.yml
        mode: "0640"

    - name: Up remnanode
      community.docker.docker_compose_v2:
        project_src: /opt/remnanode
        state: present
