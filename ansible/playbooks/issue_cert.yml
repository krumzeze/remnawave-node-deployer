---
# Выпуск TLS-сертификата для домена ноды по HTTP-01 (ADR 0005).
# Запускается ТОЛЬКО для TLS-инбаундов и ПОСЛЕ того, как оркестратор убедился,
# что домен уже резолвится на эту ноду (см. orchestrator/domain.py). Сертификат
# раскладывается в каталог, который монтируется в контейнер remnanode, поэтому
# плейбук идёт до deploy_node.
#
# HTTP-01, а не DNS-01: не требует API регистратора, поэтому registrar-agnostic
# (домен оператор берёт где угодно). Нужен свободный и открытый порт 80.
- name: Issue TLS certificate via acme.sh (HTTP-01)
  hosts: all
  become: true
  # При не-root логине sudo не подменяет HOME на /root: установщик acme.sh
  # кладёт себя в $HOME/.acme.sh логин-пользователя, и шаги ниже (Select ACME CA,
  # Issue) не находят /root/.acme.sh/acme.sh. Фиксируем HOME на весь play, чтобы
  # установщик и сам acme.sh всегда работали с {{ acme_home }}.
  environment:
    HOME: /root
  vars:
    cert_domain: ""                       # передаётся из оркестратора
    cert_email: ""                         # для регистрации аккаунта ACME
    cert_dir_host: /opt/remnanode/certs    # хост-каталог, монтируется в контейнер
    acme_home: /root/.acme.sh
    acme_server: letsencrypt               # без привязки к ZeroSSL/аккаунту по умолчанию
  tasks:
    - name: Require cert_domain
      ansible.builtin.assert:
        that:
          - cert_domain | length > 0
        fail_msg: "cert_domain не задан — нечего выпускать"

    # socat нужен acme.sh --standalone (свой слушатель на :80), curl — самому
    # установщику acme.sh ниже. На голой Ubuntu curl может отсутствовать, а без
    # него установщик молча не отработает (см. pipefail в шаге установки).
    - name: Install socat, curl and git (needed by acme.sh)
      ansible.builtin.apt:
        name:
          - socat
          - curl
          - git
        state: present
        update_cache: true

    # Порт 80 для HTTP-01 не держим открытым постоянно: его открывает и
    # закрывает сам acme.sh через pre/post-hook вокруг челленджа (см. --issue
    # ниже). Те же хуки сохраняются в конфиге домена и отрабатывают при
    # автопродлении по cron, так что 80 открыт только на считанные секунды.

    - name: Check whether acme.sh is already installed
      ansible.builtin.stat:
        path: "{{ acme_home }}/acme.sh"
      register: acme_bin

    # Ставим не через `curl | sh`, а из клона репозитория локальным установщиком.
    # В режиме пайпа установщик не может скопировать себя из файла, тянет исходники
    # сам и в ряде окружений выходит с кодом 0, ничего не положив в --home, — тогда
    # шаг «успешен», а Select ACME CA падает с невнятным No such file. Локальный
    # `./acme.sh --install --home` детерминированно кладёт бинарник в {{ acme_home }}.
    - name: Install acme.sh from source
      ansible.builtin.shell: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        git clone --depth 1 https://github.com/acmesh-official/acme.sh.git "$tmp/acme.sh"
        cd "$tmp/acme.sh"
        ./acme.sh --install --home {{ acme_home }} --accountemail {{ cert_email | quote }}
      args:
        executable: /bin/bash
      register: acme_install
      when: not acme_bin.stat.exists

    # Не доверяем коду возврата установщика: проверяем сам факт наличия бинарника,
    # иначе ошибка всплывёт ниже как непонятный No such file. Если файла нет —
    # падаем здесь и показываем вывод установщика, чтобы причина была видна сразу.
    - name: Verify acme.sh binary exists
      ansible.builtin.stat:
        path: "{{ acme_home }}/acme.sh"
      register: acme_bin_final

    - name: Fail clearly if acme.sh did not install
      ansible.builtin.fail:
        msg: >-
          acme.sh не установился в {{ acme_home }}/acme.sh.
          stdout: {{ acme_install.stdout | default('') }} |
          stderr: {{ acme_install.stderr | default('') }}
      when: not acme_bin_final.stat.exists

    - name: Select ACME CA
      ansible.builtin.command:
        cmd: "{{ acme_home }}/acme.sh --set-default-ca --server {{ acme_server }}"
      changed_when: false

    - name: Ensure per-domain cert dir
      ansible.builtin.file:
        path: "{{ cert_dir_host }}/{{ cert_domain }}"
        state: directory
        mode: "0750"

    # Идемпотентно: при повторе acme.sh сам видит валидный сертификат и не
    # переоформляет его. rc=0 — выпущен/уже есть; иное — реальная ошибка.
    - name: Issue certificate (HTTP-01 standalone)
      ansible.builtin.command:
        cmd: >-
          {{ acme_home }}/acme.sh --issue --standalone
          -d {{ cert_domain }}
          --server {{ acme_server }}
          --pre-hook "ufw allow 80/tcp || true"
          --post-hook "ufw delete allow 80/tcp || true"
        creates: "{{ acme_home }}/{{ cert_domain }}_ecc/{{ cert_domain }}.cer"

    # Ставим сертификат в монтируемый каталог. reloadcmd перезапускает контейнер
    # ноды при автообновлении (acme.sh заводит cron сам), чтобы xray подхватил
    # новый сертификат без нашего участия.
    - name: Install certificate into mounted dir
      ansible.builtin.command:
        cmd: >-
          {{ acme_home }}/acme.sh --install-cert -d {{ cert_domain }} --ecc
          --key-file {{ cert_dir_host }}/{{ cert_domain }}/key.pem
          --fullchain-file {{ cert_dir_host }}/{{ cert_domain }}/fullchain.pem
          --reloadcmd "docker restart remnanode || true"
      changed_when: true
