---
# Хардденинг сервера. Запускается ПОСЛЕ того, как вход по ключу проверен.
# Парольный вход здесь НЕ трогаем: для ветки «password» его уже отключил
# bootstrap (с учётом cloud-init drop-in и проверкой sshd -t), а для ветки
# «key» доступ оператора его собственными средствами мы не трогаем намеренно
# (ADR 0002, принцип «не навреди»).
- name: Harden server
  hosts: all
  become: true
  tasks:
    - name: Ensure UFW installed
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow SSH and default-deny incoming
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
