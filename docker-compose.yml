services:
  bot:
    build: .
    command: python -m bot
    env_file: .env
    depends_on:
      postgres: {condition: service_started}
      redis: {condition: service_started}
      vault: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: .
    command: arq orchestrator.tasks.WorkerSettings
    env_file: .env
    depends_on:
      postgres: {condition: service_started}
      redis: {condition: service_started}
      vault: {condition: service_healthy}
    restart: unless-stopped
    # Локальный разворот панели (placement=local, ADR 0001) гоняет docker compose
    # на самом хосте, поэтому воркеру нужен доступ к docker-демону хоста. Для
    # обычной работы (ноды, vps-панель) это не требуется — оставлено выключенным.
    # Включай, только если будешь разворачивать панель на хосте деплойера.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  web:
    build: .
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly + том: очередь arq и FSM-состояние мастера переживают рестарт.
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    restart: unless-stopped

  # Боевой Vault с файловым хранилищем и авто-распечаткой (см. vault/entrypoint.sh
  # и vault/config/vault.hcl). В отличие от прежнего dev-режима секреты лежат в
  # томе и переживают рестарт — из-за этого бот больше не «забывает» панель.
  vault:
    image: hashicorp/vault:1.16
    env_file: .env
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    entrypoint: ["/bin/sh", "/vault/entrypoint.sh"]
    volumes:
      - vaultdata:/vault/file
      - ./vault/config:/vault/config:ro
      - ./vault/entrypoint.sh:/vault/entrypoint.sh:ro
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  vaultdata:
